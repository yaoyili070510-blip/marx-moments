<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Karl Marx 的朋友圈 · 1848</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: #d9dde2;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  color: #1a1a1a;
}
.phone {
  max-width: 480px; margin: 0 auto; min-height: 100vh; background: #ededed;
  box-shadow: 0 0 30px rgba(0,0,0,.15); position: relative; padding-bottom: 210px;
}

/* 顶部 */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
  justify-content: space-between; height: 48px; padding: 0 14px;
  background: #f7f7f7; border-bottom: 1px solid #dcdcdc;
}
.topbar .back { font-size: 28px; color: #333; line-height: 1; margin-top: -4px; width: 32px; }
.topbar .title { font-size: 17px; font-weight: 600; }
.topbar .gear {
  width: 32px; text-align: right; font-size: 18px; color: #576b95;
  cursor: pointer; background: none; border: none; padding: 0;
}

/* 模式条 */
.modebar {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px;
  font-size: 12px; background: #fdf1e3; color: #a3702a;
  border-bottom: 1px solid #f2e3cd;
}
.modebar .dot { width: 7px; height: 7px; border-radius: 50%; background: #d89a3c; }
.modebar.live { background: #eaf7ec; color: #3a9a52; border-bottom-color: #d5efda; }
.modebar.live .dot { background: #3ec26a; }
.modebar .room { margin-left: auto; font-weight: 700; letter-spacing: 1px; }
.modebar .link { color: inherit; text-decoration: underline; cursor: pointer; }

/* 封面 */
.cover { position: relative; height: 230px; background: linear-gradient(135deg,#2c3e50,#4a6572); overflow: visible; }
.cover > svg { width: 100%; height: 100%; display: block; }
.cover-name {
  position: absolute; right: 108px; bottom: 46px; color: #fff; font-size: 19px;
  font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.cover-avatar {
  position: absolute; right: 16px; bottom: -18px; width: 74px; height: 74px;
  border-radius: 8px; border: 3px solid #fff; background: #fff; overflow: hidden;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
}
.cover-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
.cover-img { width: 100%; height: 100%; display: block; object-fit: cover; }

/* 动态 */
.post { background: #fff; margin-top: 26px; padding: 16px 16px 8px; border-bottom: 1px solid #e4e4e4; }
.p-name { color: #576b95; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.p-text { font-size: 15.5px; line-height: 1.72; margin-bottom: 10px; word-break: break-word; }
.post-images { margin: 8px 0 10px; max-width: 62%; }
.post-images svg { width: 100%; height: auto; display: block; border-radius: 4px; background: #f2f2f2; }

/* 定位 */
.post-location { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: #576b95; margin: 6px 0 12px; flex-wrap: wrap; }
.post-location .loc-time { margin-left: auto; color: #9a9a9a; font-size: 12px; }

/* 点赞 */
.post-actions { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #f0f0f0; font-size: 13px; color: #7a7a7a; }
.like-btn {
  display: inline-flex; align-items: center; gap: 4px; background: #f6f6f6; border: none;
  border-radius: 14px; padding: 5px 12px; font-size: 13px; color: #7a7a7a; cursor: pointer; transition: .15s;
}
.like-btn:active { transform: scale(.94); }
.like-btn.liked { background: #fdeaea; color: #e35b4a; }
.like-btn.liked .heart { animation: pop .35s ease; }
@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.45)} 100%{transform:scale(1)} }
.divider { color: #ddd; }

/* 评论 */
.comment-area { background: #f7f7f7; margin: 0 -16px; padding: 4px 16px 10px; }
.comment { display: flex; gap: 8px; padding: 9px 0; border-bottom: 1px solid #efefef; animation: fadein .3s ease; }
.comment:last-child { border-bottom: none; }
@keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1} }
.c-avatar {
  flex: 0 0 30px; width: 30px; height: 30px; border-radius: 4px; color: #fff;
  font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center;
}
.c-body { flex: 1; min-width: 0; }
.c-head { display: flex; align-items: baseline; gap: 8px; }
.c-name { color: #576b95; font-size: 14px; font-weight: 500; }
.c-time { color: #b0b0b0; font-size: 11px; margin-left: auto; }
.c-text { font-size: 14.5px; line-height: 1.6; margin-top: 2px; word-break: break-word; }
.comment.seed .c-name { color: #c0392b; }
.comment.seed .c-name::after {
  content: "剧情"; font-size: 10px; background: #c0392b; color: #fff; border-radius: 3px;
  padding: 1px 4px; margin-left: 5px; vertical-align: 1px;
}
.comment.mine .c-name::after { content: "我"; font-size: 10px; background: #07c160; color: #fff; border-radius: 3px; padding: 1px 4px; margin-left: 5px; }
.empty { padding: 14px 0; color: #aaa; font-size: 13px; text-align: center; }

/* 输入 */
.input-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
  background: #f7f7f7; border-top: 1px solid #dcdcdc; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  display: flex; flex-wrap: wrap; gap: 8px; z-index: 30;
}
.name-input {
  width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 7px 10px;
  font-size: 13px; outline: none; background: #fff;
}
.name-input:focus { border-color: #576b95; }
.text-input {
  flex: 1; min-width: 58%; border: 1px solid #ddd; border-radius: 6px; padding: 9px 10px;
  font-size: 14px; resize: none; outline: none; background: #fff; font-family: inherit; max-height: 90px;
}
.text-input:focus { border-color: #576b95; }
.text-input.shake { animation: shake .4s; border-color: #e35b4a; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.submit-btn {
  border: none; background: #07c160; color: #fff; border-radius: 6px; padding: 0 16px;
  font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.submit-btn:disabled { background: #a5dfbe; cursor: default; }

.toolbar { display: flex; gap: 8px; justify-content: center; padding: 12px 16px 4px; }
.tool-btn {
  border: 1px solid #dcdcdc; background: #fff; border-radius: 14px; padding: 5px 12px;
  font-size: 12px; color: #666; cursor: pointer;
}
.tool-btn:active { background: #f0f0f0; }
.tip { text-align: center; color: #9a9a9a; font-size: 12px; padding: 8px 20px 22px; line-height: 1.7; }

/* 弹窗 */
.mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.mask.show { display: flex; }
.modal {
  background: #fff; border-radius: 12px; width: 100%; max-width: 380px; padding: 18px;
  max-height: 86vh; overflow-y: auto;
}
.modal h3 { margin: 0 0 4px; font-size: 17px; }
.modal .sub { color: #888; font-size: 12.5px; margin-bottom: 14px; line-height: 1.6; }
.modal label { display: block; font-size: 13px; color: #444; margin: 12px 0 5px; }
.modal input[type=text] {
  width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 9px 10px;
  font-size: 15px; outline: none; text-align: center; letter-spacing: 3px; font-weight: 600;
}
.modal input[type=text]:focus { border-color: #576b95; }
.btn {
  width: 100%; border: none; border-radius: 8px; padding: 11px; font-size: 15px;
  font-weight: 600; cursor: pointer; margin-top: 12px;
}
.btn.primary { background: #07c160; color: #fff; }
.btn.plain { background: #f2f2f2; color: #555; }
.btn.danger { background: #fdecea; color: #d9483b; }
.btn:disabled { opacity: .55; cursor: default; }
.qrbox { text-align: center; margin-top: 14px; }
.qrbox img { width: 190px; height: 190px; border: 1px solid #eee; border-radius: 8px; background: #fff; }
.qrbox .code { font-size: 26px; font-weight: 700; letter-spacing: 6px; color: #1a1a1a; margin: 6px 0 2px; }
.qrbox .hint { font-size: 12px; color: #999; line-height: 1.6; }
.status-line { font-size: 12.5px; margin-top: 10px; text-align: center; color: #888; min-height: 18px; }
.status-line.ok { color: #3a9a52; }
.status-line.err { color: #d9483b; }
.divider-line { height: 1px; background: #eee; margin: 16px 0 4px; }

/* 投影模式 */
body.projector .phone { max-width: 900px; }
body.projector .input-bar { max-width: 900px; }
body.projector .p-text { font-size: 22px; line-height: 1.9; }
body.projector .c-text { font-size: 20px; }
body.projector .c-name { font-size: 18px; }
body.projector .p-name { font-size: 22px; }
body.projector .post-location { font-size: 17px; }
body.projector .c-avatar { flex: 0 0 38px; width: 38px; height: 38px; font-size: 18px; }
body.projector .cover { height: 300px; }
body.projector .topbar { height: 56px; }
body.projector .topbar .title { font-size: 20px; }

@media (min-width: 900px) {
  .phone { max-width: 620px; box-shadow: 0 0 60px rgba(0,0,0,.25); }
  .input-bar { max-width: 620px; }
}
</style>
</head>

  function hue(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return 'hsl(' + h + ',58%,62%)';
  }

  function randId() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function myCid() {
    var c = localStorage.getItem(CID_KEY);
    if (!c) { c = randId(); localStorage.setItem(CID_KEY, c); }
    return c;
  }

  // ---------- 状态 ----------
  var state = { likes: [], comments: [] };
  var live = { on: false, room: '', mqtt: null, topic: '', timer: null };

  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        state.likes = o.likes || [];
        state.comments = o.comments || [];
        dropOld();
        ensureSeeds();
        return;
      }
    } catch (e) {}
    state.likes = [];
    state.comments = [];
    ensureSeeds();
  }

  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // 合并远端状态：评论按 id 去重，点赞按 cid 去重
  function merge(remote) {
    if (!remote || typeof remote !== 'object') return false;
    var changed = false;
    var seen = {};
    state.comments.forEach(function (c) { seen[c.id] = 1; });
    (remote.comments || []).forEach(function (c) {
      if (c && c.id && !seen[c.id] && !DROP_IDS[c.id]) { state.comments.push(c); seen[c.id] = 1; changed = true; }
    });
    (remote.likes || []).forEach(function (id) {
      if (state.likes.indexOf(id) < 0) { state.likes.push(id); changed = true; }
    });
    return changed;
  }

  function snapshot() {
    return { v: 1, likes: state.likes, comments: state.comments, updated: Date.now() };
  }

  // ---------- 渲染 ----------
  function render() {
    $('likeCount').textContent = BASE_LIKES + state.likes.length;
    $('commentCount').textContent = state.comments.length;

    var mine = myCid();
    var box = $('commentList');
    if (!state.comments.length) {
      box.innerHTML = '<div class="empty">还没有人评论，来抢第一条。</div>';
      return;
    }
    var sorted = state.comments.slice().sort(function (a, b) { return (a.time || 0) - (b.time || 0); });
    box.innerHTML = sorted.map(function (c) {
      var cls = 'comment' + (c.seed ? ' seed' : '') + (c.cid === mine ? ' mine' : '');
      return '<div class="' + cls + '">' +
        '<div class="c-avatar" style="background:' + hue(c.name || '?') + '">' +
        escapeHtml((c.name || '?').trim().charAt(0).toUpperCase()) + '</div>' +
        '<div class="c-body"><div class="c-head"><span class="c-name">' + escapeHtml(c.name || '匿名') +
        '</span><span class="c-time">' + fmtTime(c.time || Date.now()) + '</span></div>' +
        '<div class="c-text">' + escapeHtml(c.text || '') + '</div></div></div>';
    }).join('');
  }

  function setMode(on, text) {
    var bar = $('modeBar'), chip = $('roomChip'), link = $('modeLink');
    if (on) {
      bar.className = 'modebar live';
      bar.firstElementChild.className = 'dot';
      $('modeText').textContent = text || '实时同步中 · 全班可见';
      chip.textContent = '房间 ' + live.room;
      link.textContent = '退出';
    } else {
      bar.className = 'modebar';
      $('modeText').textContent = '本地模式 · 评论存在本机';
      chip.textContent = '';
      link.textContent = '开启全班实时';
    }
    $('tipText').textContent = on
      ? '全班实时同步中 · 同学输入房间号 ' + live.room + ' 即可加入'
      : '评论保存在这台设备上 · 点右上角 ⚙ 可开启全班实时同步';
  }

  function status(msg, cls) {
    var el = $('statusLine');
    el.textContent = msg || '';
    el.className = 'status-line' + (cls ? ' ' + cls : '');
  }

  // ---------- 最小 MQTT over WebSocket 客户端 ----------
  function MiniMQTT() {
    this.ws = null;
    this.buf = new Uint8Array(0);
    this.handlers = [];
    this.ping = null;
    this.onready = null;
    this.ready = false;
  }

  MiniMQTT.prototype.varLen = function (n) {
    var out = [];
    do { var b = n % 128; n = Math.floor(n / 128); if (n > 0) b |= 0x80; out.push(b); } while (n > 0);
    return out;
  };

  MiniMQTT.prototype.connect = function (url, clientId) {
    var self = this;
    return new Promise(function (resolve, reject) {
      var ws;
      try { ws = new WebSocket(url, 'mqtt'); } catch (e) { reject(e); return; }
      ws.binaryType = 'arraybuffer';
      self.ws = ws;

      var timer = setTimeout(function () {
        try { ws.close(); } catch (e) {}
        reject(new Error('连接超时'));
      }, 12000);

      ws.onopen = function () {
        var cid = enc(clientId);
        var vh = [0x00, 0x04, 0x4D, 0x51, 0x54, 0x54, 0x04, 0x02, 0x00, 0x3C];
        var body = vh.concat([cid.length >> 8, cid.length & 0xFF]).concat(Array.from(cid));
        ws.send(new Uint8Array([0x10].concat(self.varLen(body.length)).concat(body)));
      };

      ws.onmessage = function (ev) {
        self._feed(new Uint8Array(ev.data));
        if (self.ready) { clearTimeout(timer); resolve(true); }
      };

      ws.onerror = function () { clearTimeout(timer); reject(new Error('连接失败')); };
      ws.onclose = function () {
        clearTimeout(timer);
        self.ready = false;
        if (self.ping) { clearInterval(self.ping); self.ping = null; }
        reject(new Error('连接已关闭'));
      };
    });
  };

  MiniMQTT.prototype._feed = function (bytes) {
    var merged = new Uint8Array(this.buf.length + bytes.length);
    merged.set(this.buf, 0);
    merged.set(bytes, this.buf.length);
    this.buf = merged;

    for (;;) {
      if (this.buf.length < 2) return;
      var first = this.buf[0];
      var type = first >> 4;
      var mult = 1, len = 0, idx = -1;
      for (var i = 1; i < 5; i++) {
        len += (this.buf[i] & 0x7F) * mult;
        if ((this.buf[i] & 0x80) === 0) { idx = i + 1; break; }
        mult *= 128;
      }
      if (idx < 0) { if (this.buf.length >= 5) this.buf = new Uint8Array(0); return; }
      if (this.buf.length < idx + len) return;

      var body = this.buf.slice(idx, idx + len);
      this.buf = this.buf.slice(idx + len);
      this._packet(type, body, first);
    }
  };

  MiniMQTT.prototype._packet = function (type, body, first) {
    var self = this;
    if (type === 2) {                       // CONNACK
      if (body.length >= 2 && body[1] === 0) {
        this.ready = true;
        this.ping = setInterval(function () {
          if (self.ws && self.ws.readyState === 1) self.ws.send(new Uint8Array([0xC0, 0x00]));
        }, 30000);
      }
      return;
    }
    if (type === 3) {                       // PUBLISH
      var tl = (body[0] << 8) | body[1];
      var topic = dec(body.slice(2, 2 + tl));
      var payload = dec(body.slice(2 + tl));
      this.handlers.forEach(function (h) {
        if (h.topic === topic) { try { h.cb(payload); } catch (e) {} }
      });
      return;
    }
    if (type === 13) return;                // PINGRESP
  };

  MiniMQTT.prototype.subscribe = function (topic, cb) {
    this.handlers.push({ topic: topic, cb: cb });
    var t = enc(topic);
    var body = [0x00, 0x01, t.length >> 8, t.length & 0xFF].concat(Array.from(t)).concat([0x00]);
    this.ws.send(new Uint8Array([0x82].concat(this.varLen(body.length)).concat(body)));
  };

  MiniMQTT.prototype.publish = function (topic, payload, retain) {
    if (!this.ws || this.ws.readyState !== 1) return;
    var t = enc(topic), p = enc(payload);
    var body = [t.length >> 8, t.length & 0xFF].concat(Array.from(t)).concat(Array.from(p));
    var flags = 0x30 | (retain ? 0x01 : 0x00);
    this.ws.send(new Uint8Array([flags].concat(this.varLen(body.length)).concat(body)));
  };

  MiniMQTT.prototype.close = function () {
    if (this.ping) { clearInterval(this.ping); this.ping = null; }
    if (this.ws) { try { this.ws.close(); } catch (e) {} }
    this.ready = false;
  };

  // ---------- 实时模式 ----------
  function publishNow() {
    if (!live.on || !live.mqtt || !live.mqtt.ready) return;
    live.mqtt.publish(live.topic, JSON.stringify(snapshot()), true);
  }

  function publishDebounced() {
    if (!live.on) return;
    if (live.timer) clearTimeout(live.timer);
    live.timer = setTimeout(publishNow, 400 + Math.random() * 500);
  }

  function joinRoom(room) {
    var btn = $('joinBtn');
    btn.disabled = true;
    status('正在连接实时通道…');

    var mqtt = new MiniMQTT();
    var cid = 'marx-' + myCid().slice(0, 10);
    var topic = TOPIC_PREFIX + room + '/state';
    var idx = 0;

    function tryNext() {
      if (idx >= BROKERS.length) {
        btn.disabled = false;
        status('实时通道连接失败（网络可能限制了端口），已留在本地模式', 'err');
        return;
      }
      var url = BROKERS[idx++];
      status('正在连接 ' + url.split('/')[2] + ' …');

      var m = (idx === 1) ? mqtt : new MiniMQTT();
      m.connect(url, cid).then(function () {
        live.mqtt = m;
        live.on = true;
        live.room = room;
        live.topic = topic;

        m.subscribe(topic, function (payload) {
          try {
            var remote = JSON.parse(payload);
            if (merge(remote)) { saveLocal(); render(); }
          } catch (e) {}
        });

        // 拉到历史状态后，把本地内容补上去（防止本机评论丢失）
        setTimeout(function () {
          m.publish(topic, JSON.stringify(snapshot()), true);
        }, 900);

        setMode(true);
        $('roomInput').value = room;
        showQR(room);
        btn.disabled = false;
        status('已连接 · 房间 ' + room + ' · 把房间号告诉全班', 'ok');
        try { localStorage.setItem('marx_room', room); } catch (e) {}
      }).catch(function () {
        try { m.close(); } catch (e) {}
        tryNext();
      });
    }

    tryNext();
  }

  function showQR(room) {
    var box = $('qrBox');
    box.style.display = 'block';
    $('qrCode').textContent = room;
    var text = '马克思的朋友圈 房间号 ' + room;
    var img = $('qrImg');
    img.onload = function () { img.style.display = 'inline-block'; };
    img.onerror = function () { img.style.display = 'none'; };
    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=' + encodeURIComponent(text);
  }

  function leaveRoom() {
    if (live.mqtt) live.mqtt.close();
    live.on = false; live.mqtt = null; live.room = ''; live.topic = '';
    setMode(false);
    $('qrBox').style.display = 'none';
    try { localStorage.removeItem('marx_room'); } catch (e) {}
  }

  // ---------- 交互 ----------
  function submit() {
    var nameEl = $('nameInput'), textEl = $('textInput'), btn = $('submitBtn');
    var name = (nameEl.value || '').trim();
    var text = (textEl.value || '').trim();

    if (!name) {
      nameEl.focus();
      nameEl.classList.add('shake');
      setTimeout(function () { nameEl.classList.remove('shake'); }, 500);
      status2('先填名字再发评论');
      return;
    }
    if (!text) {
      textEl.focus();
      textEl.classList.add('shake');
      setTimeout(function () { textEl.classList.remove('shake'); }, 500);
      return;
    }

    state.comments.push({
      id: randId(), cid: myCid(), name: name.slice(0, 16),
      text: text.slice(0, 200), time: Date.now()
    });
    textEl.value = '';
    saveLocal();
    render();
    publishDebounced();
    setTimeout(function () {
      var el = document.querySelector('.comment.mine');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
  }

  var tipTimer = null;
  function status2(msg) {
    var el = $('tipText');
    if (live.on) return;
    el.textContent = msg;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () {
      el.textContent = '评论保存在这台设备上 · 点右上角 ⚙ 可开启全班实时同步';
    }, 2200);
  }

  function like() {
    var cid = myCid();
    if (state.likes.indexOf(cid) >= 0) return;
    state.likes.push(cid);
    saveLocal();
    render();
    publishDebounced();
    $('likeBtn').classList.add('liked');
  }

  function exportTxt() {
    var lines = ['Karl Marx 的一条朋友圈 · 评论区导出', '📍伦敦 · 1848年2月', '点赞：' + (BASE_LIKES + state.likes.length), '', ''];
    state.comments.slice().sort(function (a, b) { return (a.time || 0) - (b.time || 0); }).forEach(function (c) {
      lines.push((c.name || '匿名') + '：' + (c.text || ''));
    });
    var blob = new Blob([lines.join('\r\n')], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '马克思朋友圈评论.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function clearAll() {
    if (!confirm('确定清空所有同学的真实评论吗？（剧情评论会保留）')) return;
    state.comments = SEED.slice();
    state.likes = [];
    saveLocal();
    render();
    publishDebounced();
    $('likeBtn').classList.remove('liked');
  }

  // ---------- 初始化 ----------
  function init() {
    loadLocal();
    render();
    setMode(false);
    if (state.likes.indexOf(myCid()) >= 0) $('likeBtn').classList.add('liked');

    var savedName = localStorage.getItem('marx_name');
    if (savedName) $('nameInput').value = savedName;
    $('nameInput').addEventListener('change', function () {
      localStorage.setItem('marx_name', this.value.trim());
    });

    $('submitBtn').addEventListener('click', submit);
    $('likeBtn').addEventListener('click', like);
    $('textInput').addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submit();
    });

    $('gearBtn').addEventListener('click', function () { $('mask').classList.add('show'); });
    $('closeBtn').addEventListener('click', function () { $('mask').classList.remove('show'); });
    $('mask').addEventListener('click', function (e) {
      if (e.target === $('mask')) $('mask').classList.remove('show');
    });

    $('modeLink').addEventListener('click', function () {
      if (live.on) { leaveRoom(); status('已退出实时模式'); }
      else $('mask').classList.add('show');
    });

    $('joinBtn').addEventListener('click', function () {
      var room = ($('roomInput').value || '').trim();
      if (!/^\d{4,8}$/.test(room)) {
        status('房间号请输入 4-8 位数字', 'err');
        return;
      }
      joinRoom(room);
    });

    $('offlineBtn').addEventListener('click', function () {
      leaveRoom();
      status('已退回本地模式，评论只存在这台设备');
    });

    $('resetBtn').addEventListener('click', clearAll);
    $('exportBtn').addEventListener('click', exportTxt);
    $('clearBtn').addEventListener('click', clearAll);
    $('projectorBtn').addEventListener('click', function () {
      document.body.classList.toggle('projector');
      this.textContent = document.body.classList.contains('projector') ? '退出投影' : '投影模式';
    });

    // 自动加入：URL ?room=184802，或上次用过的房间
    var m = /[?&]room=(\d{4,8})/.exec(location.search);
    var last = null;
    try { last = localStorage.getItem('marx_room'); } catch (e) {}
    var auto = (m && m[1]) || last;
    if (auto && navigator.onLine) {
      $('roomInput').value = auto;
      joinRoom(auto);
    } else if (auto) {
      $('roomInput').value = auto;
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
